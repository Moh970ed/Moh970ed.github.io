# Workflow النشر: كل push إلى main يبني نسخة Vite ثم يرفع dist إلى GitHub Pages.
name: Deploy Vite Project to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # job واحد يجمع التثبيت والبناء والرفع حتى تكون النسخة المنشورة متطابقة مع main.
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite default build output folder

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

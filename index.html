<!-- القالب الوحيد الذي يحمّل React: يحدد metadata وملف الدخول العام للموقع. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Mohammed El-Sayed — Game &amp; Mobile App Developer</title>
    <!-- وصف يظهر في نتائج البحث ومعاينات المشاركة. -->
    <meta name="description" content="Portfolio of Mohammed El-Sayed, a Junior Software Engineer focused on game development and cross-platform mobile applications." />
    <meta name="robots" content="index, follow" />
    <!-- بيانات Open Graph وTwitter تتحكم في شكل بطاقة الرابط عند مشاركته. -->
    <meta property="og:title" content="Mohammed El-Sayed — Game &amp; Mobile App Developer" />
    <meta property="og:description" content="Interactive games and polished cross-platform mobile experiences by Mohammed El-Sayed." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohammed El-Sayed — Game &amp; Mobile App Developer" />
    <meta name="twitter:description" content="Interactive games and polished cross-platform mobile experiences by Mohammed El-Sayed." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- React يركب التطبيق هنا، ثم يتم تحميل main.tsx كـ ES module. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
